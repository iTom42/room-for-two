<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBFAF8">
<title>Room for Two</title>
<style>
  :root{
    --paper:#FBFAF8; --paper-2:#FFFFFF;
    --ink:#14140F; --ink-2:#56554E; --ink-3:#74726A;
    --rule:#E4E2DA; --rule-soft:#EFEDE6;
    --red:#E01F00;           /* Ferrari red — the one accent */
    --red-wash:#FDEEEB;
    --shadow:0 1px 2px rgba(20,20,15,.04), 0 8px 28px rgba(20,20,15,.06);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:400 18px/1.55 var(--sans); -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  main{width:100%; max-width:520px}

  h1{
    font-size:clamp(26px,5vw,34px); font-weight:800; letter-spacing:-.02em;
    margin:0 0 6px;
  }
  .sub{color:var(--ink-3); font-size:clamp(15px,2.6vw,17px); margin:0 0 40px}

  button{
    font:600 18px/1 var(--sans); color:var(--paper-2); background:var(--ink);
    border:0; border-radius:12px; padding:18px 28px; cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button.ghost{background:transparent; color:var(--ink-2); border:1px solid var(--rule); font-weight:500}

  .or{margin:26px 0 18px; color:var(--ink-3); font-size:14px; letter-spacing:.14em; text-transform:uppercase}

  .joinrow{display:flex; gap:10px; justify-content:center}
  input{
    font:700 22px/1 var(--sans); letter-spacing:.22em; text-align:center; text-transform:uppercase;
    width:180px; padding:16px 10px; border:1px solid var(--rule); border-radius:12px;
    background:var(--paper-2); color:var(--ink);
  }
  input:focus{outline:2px solid var(--red); outline-offset:2px; border-color:transparent}

  /* the room code, made to be read out loud over a video call */
  .code{
    font-size:clamp(54px,14vw,86px); font-weight:800; letter-spacing:.16em;
    line-height:1; margin:14px 0 10px; color:var(--red);
  }
  .codelabel{font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}

  /* the same link as a QR, so the other phone scans instead of typing */
  .qr{
    width:min(58vw,236px); margin:20px auto 16px; padding:14px;
    background:var(--paper-2); border:1px solid var(--rule); border-radius:16px;
    box-shadow:var(--shadow); color:var(--ink);
  }
  .qr svg{display:block; width:100%; height:auto}

  .waiting{color:var(--ink-2); margin-top:28px}
  .dots::after{content:''; animation:dots 1.4s steps(4,end) infinite}
  @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

  .status{
    font-size:clamp(20px,4vw,26px); font-weight:700; min-height:1.5em; margin:0 0 22px;
  }
  .status.you{color:var(--red)}
  .status.them{color:var(--ink-3); font-weight:500}

  .board{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    width:min(86vw,400px); aspect-ratio:1; margin:0 auto 26px;
  }
  .cell{
    background:var(--paper-2); border:1px solid var(--rule); border-radius:14px;
    box-shadow:var(--shadow); cursor:pointer; padding:0;
    font-size:clamp(40px,11vw,64px); font-weight:800; line-height:1;
    color:var(--ink); display:grid; place-items:center;
    transition:background .12s ease, transform .12s ease;
  }
  .cell:hover:not(:disabled){transform:none; background:var(--rule-soft)}
  .cell:disabled{cursor:default}
  .cell.o{color:var(--red)}
  .cell .mark{animation:pop .18s ease-out}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

  .foot{margin-top:8px; color:var(--ink-3); font-size:14px}
  .foot b{color:var(--ink-2); font-weight:600; letter-spacing:.14em}
  .err{color:var(--red); min-height:1.4em; margin-top:14px; font-size:15px}
  [hidden]{display:none !important}
</style>
</head>
<body>
<main>

  <section id="lobby">
    <h1>Room for Two</h1>
    <p class="sub">One game, two devices, one shared board.</p>
    <button id="create">Start a game</button>
    <p class="or">or join one</p>
    <form class="joinrow" id="joinform">
      <input id="codeinput" maxlength="4" placeholder="CODE" autocomplete="off"
             autocapitalize="characters" spellcheck="false" aria-label="Room code">
      <button class="ghost" type="submit">Join</button>
    </form>
    <p class="err" id="err"></p>
  </section>

  <section id="wait" hidden>
    <p class="codelabel">Your room code</p>
    <p class="code" id="code">····</p>
    <div class="qr" id="qr" hidden></div>
    <p class="sub" id="joinhint"></p>
    <p class="waiting">Waiting for the second player<span class="dots"></span></p>
  </section>

  <section id="game" hidden>
    <p class="status" id="status"></p>
    <div class="board" id="board"></div>
    <button id="again" hidden>Play again</button>
    <p class="foot">Room <b id="footcode"></b> · you are <b id="footmark"></b></p>
  </section>

</main>
<script>
const $ = (id) => document.getElementById(id);
const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${proto}//${location.host}`);

let me = null, over = false, shownQr = null;

function show(which){
  for (const id of ['lobby','wait','game']) $(id).hidden = (id !== which);
}

ws.addEventListener('open', () => {
  const pre = new URLSearchParams(location.search).get('room');
  if (pre) ws.send(JSON.stringify({ type:'join', code: pre }));
});

ws.addEventListener('close', () => {
  $('status').textContent = 'Connection lost. Reload the page.';
  $('status').className = 'status';
});

ws.addEventListener('message', (e) => {
  const msg = JSON.parse(e.data);

  if (msg.type === 'error'){
    $('err').textContent = msg.reason === 'full'
      ? 'That room already has two players.'
      : 'No room with that code.';
    show('lobby');
    return;
  }

  if (msg.type === 'state'){
    me = msg.you;
    over = msg.over;
    $('footcode').textContent = msg.code;
    $('footmark').textContent = msg.you;

    if (!msg.ready && !msg.paused){
      $('code').textContent = msg.code;
      const url = `${location.origin}/?room=${msg.code}`;
      if (url !== shownQr){ showQr(url); shownQr = url; }
      $('joinhint').textContent = `Scan it with the other device, or type the code at ${location.host}`;
      show('wait');
      return;
    }

    if (msg.paused){
      // the other device dropped — the board is kept, they rejoin with the code
      show('game');
      $('status').textContent = `Waiting for the other player — code ${msg.code}`;
      $('status').className = 'status them';
      $('again').hidden = true;
      render(msg.board, true);
      return;
    }

    show('game');
    if (msg.over){
      $('status').textContent = msg.winner === null
        ? 'A draw.'
        : (msg.winner === me ? 'You win.' : 'You lose.');
      $('status').className = 'status' + (msg.winner === me ? ' you' : '');
      $('again').hidden = false;
    } else {
      const mine = msg.turn === me;
      $('status').textContent = mine ? 'Your turn' : 'Their turn';
      $('status').className = 'status ' + (mine ? 'you' : 'them');
      $('again').hidden = true;
    }
    render(msg.board, msg.over || msg.turn !== me);
  }
});

function render(board, locked){
  const el = $('board');
  if (el.children.length !== 9){
    el.innerHTML = '';
    for (let i = 0; i < 9; i++){
      const b = document.createElement('button');
      b.className = 'cell';
      b.addEventListener('click', () => ws.send(JSON.stringify({ type:'move', cell:i })));
      el.appendChild(b);
    }
  }
  [...el.children].forEach((b, i) => {
    const v = board[i];
    if (b.dataset.v !== String(v)){
      b.dataset.v = String(v);
      b.innerHTML = v ? `<span class="mark">${v}</span>` : '';
    }
    b.classList.toggle('o', v === 'O');
    b.disabled = locked || !!v;
  });
}

// ---- QR ------------------------------------------------------------------
// Enough of the spec to put a short URL on screen: byte mode, error
// correction level M, versions 1-6 (up to 106 characters). No library and no
// CDN on purpose — the join code has to work on a laptop with no wifi.
function qrMatrix(text){
  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  for (let i = 0, x = 1; i < 255; i++){
    EXP[i] = x; LOG[x] = i;
    x <<= 1; if (x & 256) x ^= 0x11d;
  }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  const mul = (a, b) => (a && b) ? EXP[LOG[a] + LOG[b]] : 0;

  // version -> [data codewords per block, ec codewords per block, blocks].
  // Level M only, and only the versions whose blocks are all the same size.
  const SPEC = { 1:[16,10,1], 2:[28,16,1], 3:[44,26,1], 4:[32,18,2], 5:[43,24,2], 6:[27,16,4] };
  const ALIGN = { 2:18, 3:22, 4:26, 5:30, 6:34 };  // the single alignment centre

  const bytes = new TextEncoder().encode(text);
  let version = 0;
  for (let v = 1; v <= 6; v++){
    const [dc, , nb] = SPEC[v];
    if (dc * nb * 8 >= 12 + bytes.length * 8){ version = v; break; }
  }
  if (!version) throw new Error('too long for a version 6 QR code');

  const [dcPerBlock, ecPerBlock, blocks] = SPEC[version];
  const size = 17 + 4 * version;

  // data codewords: mode, length, payload, terminator, padding
  const bits = [];
  const push = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >> i) & 1); };
  push(0b0100, 4);
  push(bytes.length, 8);
  for (const b of bytes) push(b, 8);
  const capacity = dcPerBlock * blocks * 8;
  for (let i = 0; i < 4 && bits.length < capacity; i++) bits.push(0);
  while (bits.length % 8) bits.push(0);
  const data = [];
  for (let i = 0; i < bits.length; i += 8)
    data.push(bits.slice(i, i + 8).reduce((a, b) => (a << 1) | b, 0));
  for (let pad = 0; data.length < dcPerBlock * blocks; pad++)
    data.push(pad % 2 ? 0x11 : 0xec);

  // Reed-Solomon over GF(256)
  let gen = [1];
  for (let i = 0; i < ecPerBlock; i++){
    const next = new Array(gen.length + 1).fill(0);
    for (let j = 0; j < gen.length; j++){
      next[j] ^= gen[j];
      next[j + 1] ^= mul(gen[j], EXP[i]);
    }
    gen = next;
  }
  const dataBlocks = [], ecBlocks = [];
  for (let b = 0; b < blocks; b++){
    const block = data.slice(b * dcPerBlock, (b + 1) * dcPerBlock);
    const rem = new Array(ecPerBlock).fill(0);
    for (const d of block){
      const factor = d ^ rem[0];
      rem.shift(); rem.push(0);
      for (let i = 0; i < ecPerBlock; i++) rem[i] ^= mul(gen[i + 1], factor);
    }
    dataBlocks.push(block); ecBlocks.push(rem);
  }
  const final = [];
  for (let i = 0; i < dcPerBlock; i++) for (const b of dataBlocks) final.push(b[i]);
  for (let i = 0; i < ecPerBlock; i++) for (const b of ecBlocks) final.push(b[i]);

  // the fixed patterns
  const m = Array.from({length:size}, () => new Array(size).fill(0));
  const fixed = Array.from({length:size}, () => new Array(size).fill(false));
  const set = (r, c, v) => { m[r][c] = v ? 1 : 0; fixed[r][c] = true; };

  const finder = (r0, c0) => {
    for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++){
      const rr = r0 + r, cc = c0 + c;
      if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
      const inner = r >= 0 && r <= 6 && c >= 0 && c <= 6;
      const ring = inner && (r === 0 || r === 6 || c === 0 || c === 6);
      const core = inner && r >= 2 && r <= 4 && c >= 2 && c <= 4;
      set(rr, cc, ring || core);
    }
  };
  finder(0, 0); finder(0, size - 7); finder(size - 7, 0);
  for (let i = 8; i < size - 8; i++){ set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
  if (version >= 2){
    const a = ALIGN[version];
    for (let r = -2; r <= 2; r++) for (let c = -2; c <= 2; c++)
      set(a + r, a + c, Math.max(Math.abs(r), Math.abs(c)) !== 1);
  }
  for (let i = 0; i <= 8; i++){
    if (!fixed[i][8]) set(i, 8, 0);
    if (!fixed[8][i]) set(8, i, 0);
  }
  for (let i = 0; i < 8; i++) if (!fixed[8][size - 1 - i]) set(8, size - 1 - i, 0);
  for (let i = 0; i < 7; i++) if (!fixed[size - 1 - i][8]) set(size - 1 - i, 8, 0);
  set(size - 8, 8, 1);  // the always-dark module

  // data, zigzagging up and down from the bottom right
  let bit = 0;
  const totalBits = final.length * 8;
  for (let right = size - 1; right >= 1; right -= 2){
    if (right === 6) right = 5;  // skip the vertical timing column
    for (let vert = 0; vert < size; vert++){
      for (let j = 0; j < 2; j++){
        const c = right - j;
        const upward = ((right + 1) & 2) === 0;
        const r = upward ? size - 1 - vert : vert;
        if (fixed[r][c] || bit >= totalBits) continue;
        m[r][c] = (final[bit >>> 3] >> (7 - (bit & 7))) & 1;
        bit++;
      }
    }
  }

  // eight masks, lowest penalty wins
  const MASKS = [
    (r,c) => (r + c) % 2 === 0,
    (r) => r % 2 === 0,
    (r,c) => c % 3 === 0,
    (r,c) => (r + c) % 3 === 0,
    (r,c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
    (r,c) => ((r * c) % 2) + ((r * c) % 3) === 0,
    (r,c) => (((r * c) % 2) + ((r * c) % 3)) % 2 === 0,
    (r,c) => (((r + c) % 2) + ((r * c) % 3)) % 2 === 0,
  ];
  const RUN = [1,0,1,1,1,0,1,0,0,0,0];
  function penalty(g){
    let score = 0;
    const lines = [];
    for (let r = 0; r < size; r++) lines.push(g[r].slice());
    for (let c = 0; c < size; c++) lines.push(g.map((row) => row[c]));
    for (const line of lines){
      let run = 1;
      for (let i = 1; i < size; i++){
        if (line[i] === line[i - 1]) run++;
        else { if (run >= 5) score += 3 + (run - 5); run = 1; }
      }
      if (run >= 5) score += 3 + (run - 5);
      const p = [0,0,0,0, ...line, 0,0,0,0];
      for (let i = 0; i + 11 <= p.length; i++){
        let fwd = true, rev = true;
        for (let k = 0; k < 11; k++){
          if (p[i + k] !== RUN[k]) fwd = false;
          if (p[i + k] !== RUN[10 - k]) rev = false;
        }
        if (fwd || rev) score += 40;
      }
    }
    for (let r = 0; r < size - 1; r++) for (let c = 0; c < size - 1; c++){
      const v = g[r][c];
      if (v === g[r][c + 1] && v === g[r + 1][c] && v === g[r + 1][c + 1]) score += 3;
    }
    let dark = 0;
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) dark += g[r][c];
    score += Math.floor(Math.abs((dark * 100) / (size * size) - 50) / 5) * 10;
    return score;
  }
  function formatBits(mask){
    const v = (0b00 << 3) | mask;          // 0b00 is level M
    let rem = v;
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ (((rem >> 9) & 1) * 0x537);
    return (((v << 10) | rem) ^ 0x5412) & 0x7fff;
  }

  let best = null, bestScore = Infinity;
  for (let mask = 0; mask < 8; mask++){
    const g = m.map((row) => row.slice());
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++)
      if (!fixed[r][c] && MASKS[mask](r, c)) g[r][c] ^= 1;
    const fb = formatBits(mask), at = (i) => (fb >> i) & 1;
    for (let i = 0; i <= 5; i++) g[i][8] = at(i);
    g[7][8] = at(6); g[8][8] = at(7); g[8][7] = at(8);
    for (let i = 9; i < 15; i++) g[8][14 - i] = at(i);
    for (let i = 0; i < 8; i++) g[8][size - 1 - i] = at(i);
    for (let i = 8; i < 15; i++) g[size - 15 + i][8] = at(i);
    g[size - 8][8] = 1;
    const s = penalty(g);
    if (s < bestScore){ bestScore = s; best = g; }
  }
  return best;
}

function showQr(url){
  const box = $('qr');
  try {
    const m = qrMatrix(url), n = m.length, q = 4;  // q: the quiet zone scanners need
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
      if (m[r][c]) d += `M${c + q} ${r + q}h1v1h-1z`;
    box.innerHTML = `<svg viewBox="0 0 ${n + q * 2} ${n + q * 2}" shape-rendering="crispEdges" `
      + `role="img" aria-label="Scan to join room ${url.slice(-4)}">`
      + `<path fill="currentColor" d="${d}"/></svg>`;
    box.hidden = false;
  } catch {
    box.hidden = true;   // link too long to encode — the code above still works
  }
}

$('create').addEventListener('click', () => ws.send(JSON.stringify({ type:'create' })));
$('again').addEventListener('click', () => ws.send(JSON.stringify({ type:'again' })));
$('joinform').addEventListener('submit', (e) => {
  e.preventDefault();
  $('err').textContent = '';
  const code = $('codeinput').value.trim().toUpperCase();
  if (code.length === 4) ws.send(JSON.stringify({ type:'join', code }));
});
</script>
</body>
</html>
